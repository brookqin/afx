name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test CLI
        working-directory: cli
        run: go test ./...

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must be semantic versioned, for example v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          build_date="$(git show -s --format=%cI "$RELEASE_COMMIT")"
          mkdir -p dist/packages

          targets=(
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
          )

          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive_base="afx_${version}_${goos}_${goarch}"
            package_dir="dist/packages/${archive_base}"
            binary="afx"
            if [[ "$goos" == "windows" ]]; then
              binary="afx.exe"
            fi

            mkdir -p "$package_dir"
            (
              cd cli
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
                -trimpath \
                -ldflags="-s -w -X afx/internal/buildinfo.Version=${RELEASE_TAG} -X afx/internal/buildinfo.Commit=${RELEASE_COMMIT} -X afx/internal/buildinfo.Date=${build_date}" \
                -o "../${package_dir}/${binary}" .
            )
            cp LICENSE README.md "$package_dir/"

            if [[ "$goos" == "windows" ]]; then
              (cd "$package_dir" && zip -q "../../${archive_base}.zip" "$binary" LICENSE README.md)
            else
              tar -C "$package_dir" -czf "dist/${archive_base}.tar.gz" "$binary" LICENSE README.md
            fi
          done

          version_output="$(dist/packages/afx_${version}_linux_amd64/afx version)"
          grep -F "afx ${RELEASE_TAG}" <<<"$version_output"

          (
            cd dist
            sha256sum afx_* > checksums.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/afx_*
          dist/checksums.txt
          --verify-tag
          --generate-notes
          --title "AFX ${{ github.ref_name }}"
